<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Logo de ejemplo de la demo: el monograma "LI" de Lucero | Ibarra (spec 009, anexo A). -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22303C" />
      <stop offset="1" stop-color="#3E5C76" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#fondo)" />
  <rect x="32" y="32" width="448" height="448" rx="72" fill="none" stroke="#FAFCFD" stroke-opacity="0.35" stroke-width="4" />
  <g fill="#FAFCFD">
    <!-- L: asta, serifa de arriba y base. -->
    <rect x="150" y="132" width="44" height="236" />
    <rect x="124" y="132" width="96" height="16" />
    <rect x="124" y="352" width="138" height="16" />
    <!-- I: asta y serifas. -->
    <rect x="318" y="132" width="44" height="236" />
    <rect x="292" y="132" width="96" height="16" />
    <rect x="292" y="352" width="96" height="16" />
  </g>
  <rect x="124" y="392" width="264" height="4" fill="#FAFCFD" fill-opacity="0.6" />
</svg>
