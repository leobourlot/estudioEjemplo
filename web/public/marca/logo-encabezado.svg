<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Logo de ejemplo para el encabezado blanco del sitio: el monograma "LI" en los colores de la marca, sin fondo (spec 009, anexo A). -->
  <defs>
    <linearGradient id="letras" gradientUnits="userSpaceOnUse" x1="124" y1="0" x2="388" y2="0">
      <stop offset="0" stop-color="#22303C" />
      <stop offset="1" stop-color="#3E5C76" />
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="448" height="448" rx="72" fill="none" stroke="#3E5C76" stroke-opacity="0.45" stroke-width="6" />
  <g fill="url(#letras)">
    <!-- L: asta, serifa de arriba y base. -->
    <rect x="150" y="132" width="44" height="236" />
    <rect x="124" y="132" width="96" height="16" />
    <rect x="124" y="352" width="138" height="16" />
    <!-- I: asta y serifas. -->
    <rect x="318" y="132" width="44" height="236" />
    <rect x="292" y="132" width="96" height="16" />
    <rect x="292" y="352" width="96" height="16" />
    <rect x="124" y="392" width="264" height="4" fill-opacity="0.6" />
  </g>
</svg>
